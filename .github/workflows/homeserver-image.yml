# Builds the cal.diy web image for the homeserver (cal.pranavdhadwal.com) and
# pushes it to GHCR. Upstream publishes no cal.diy image, and the old
# calcom/cal.com image ships a vulnerable Next.js. To update: sync the fork
# with upstream, then run this workflow (Actions -> Run workflow).
name: Homeserver image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/homeserver-image.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://cal.pranavdhadwal.com
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          tags: |
            ghcr.io/storryy/cal.diy:latest
            ghcr.io/storryy/cal.diy:${{ steps.tag.outputs.sha }}
